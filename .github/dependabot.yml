version: 2
updates:
  # Keep NuGet packages up-to-date.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 10
    groups:
      testing:
        patterns:
          - "xunit*"
          - "NSubstitute"
          - "coverlet.*"
          - "NetArchTest.Rules"
          - "Bogus"
          - "Microsoft.NET.Test.Sdk"
    # These are pinned per-TargetFramework in Directory.Packages.props (net8.0 -> 8.*,
    # net9.0 -> 9.*, net10.0 -> 10.*) — CentralPackageFloatingVersionsEnabled already
    # floats each to the latest matching release at restore time, and Dependabot can't
    # represent one package pinned to three different major versions depending on TFM
    # as a single update target, so they're ignored here to avoid incorrect/duplicate PRs.
    # (This also empties out what used to be the "redis-and-resilience" group above —
    # both packages it matched live only in this TFM-conditioned block.)
    ignore:
      - dependency-name: "Microsoft.Extensions.Diagnostics.Testing"
      - dependency-name: "Microsoft.Extensions.Caching.StackExchangeRedis"
      - dependency-name: "Microsoft.Extensions.Http.Polly"

  # Keep GitHub Actions pinned and up-to-date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "security"
      - "ci"
    open-pull-requests-limit: 5
